name: CMake Tests

on: [push]

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install X11 and OpenGL dependencies (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev

    - name: Configure CMake (ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p build
        cd build
        cmake ..

    - name: Configure CMake (windows only)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir -p build
        cd build
        cmake .. -G "Visual Studio 17 2022"

    - name: Build
      working-directory: ./build
      run: |
          cmake --build . --config Release

    - name: Run Tests
      working-directory: ./build
      run: |
          ctest -C Release --output-on-failure

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: |
          build/Testing/**/*.xml
          build/*.log
