name: CMake Tests - Ubuntu

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup and Build
      run: |
        chmod +x setup.sh
        ./setup.sh

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-ubuntu
        path: |
          build/Testing/**/*.xml
          build/*.log